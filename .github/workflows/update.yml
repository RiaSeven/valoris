name: Mise à jour Valoris V2 (Asie & Occident)

on:
  schedule:
    # 08h30 UTC : après la clôture de Tokyo (Nikkei) et Séoul (KOSPI)
    - cron: '30 8 * * 1-5'
    # 20h30 UTC : après la clôture de Paris, Francfort et Wall Street
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Collecter actions (FR/DE/US/KR/JP) et macro
        run: python fetch_and_score.py

      - name: Publier les données mises à jour
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history.json
          if git diff --staged --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "chore: mise à jour Valoris V2 ($(date +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
