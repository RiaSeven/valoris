name: Mise à jour Valoris V4 (Asie matin & Occident soir)

on:
  schedule:
    # 08h30 UTC : clôture Asie (Tokyo & Séoul) -> Briefing Asie
    - cron: '30 8 * * 1-5'
    # 20h30 UTC : clôture Europe & Wall Street -> Briefing Europe & US
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'Session à collecter (all = tout, asia = KR/JP, west = FR/DE/US)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - asia
          - west

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Collecter fondamentaux, technique (RSI/MACD/Fibo) et briefings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          elif [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ]; then
            SESSION="asia"
          elif [ "${{ github.event.schedule }}" = "30 20 * * 1-5" ]; then
            SESSION="west"
          else
            SESSION="auto"
          fi
          echo "Session sélectionnée : $SESSION"
          python fetch_and_score.py --session "$SESSION"

      - name: Publier les données mises à jour
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history.json
          if git diff --staged --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "chore: mise à jour Valoris V4 ($(date +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
